server {
    listen 80;
    listen [::]:80;
    server_name oxfuzz.bionicloud.net;
    root /srv/oxfuzz/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";
    location / {
        try_files $uri $uri/ =404;
    }
    location /downloads/ {
        autoindex off;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
