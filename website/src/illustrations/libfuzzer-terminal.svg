<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">libFuzzer terminal workflow illustration</title>
<desc id="desc">Illustrative commands, not an executed session. 01  BUILD YOUR HARNESS: $ clang++ -g -O1 -fsanitize=fuzzer,address \     harness.cc parser.cc -o fuzz_parser 02  RUN WITH A CORPUS: $ mkdir -p corpus artifacts $ ./fuzz_parser corpus -max_total_time=60 \     -artifact_prefix=artifacts/ 03  REPLAY A SAVED INPUT: $ ./fuzz_parser artifacts/crash-&lt;hash&gt;</desc>
<rect width="1040" height="620" rx="12" fill="#111312"/>
<path d="M0 66H1040" stroke="#30332e"/>
<path d="M32 25l10 8-10 8m18 0h13" fill="none" stroke="#c8b560" stroke-width="2.5"/>
<text x="82" y="41" fill="#e8e6e1" font-family="ui-monospace, monospace" font-size="22">libFuzzer / terminal workflow</text>
<text x="1000" y="40" text-anchor="end" fill="#aaa59e" font-family="ui-monospace, monospace" font-size="15">ILLUSTRATION</text>
<text x="38" y="110" fill="#6fcf97" font-family="ui-monospace, monospace" font-size="18" letter-spacing="1">01  BUILD YOUR HARNESS</text>
<text x="38" y="151" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">$ clang++ -g -O1 -fsanitize=fuzzer,address \</text>
<text x="38" y="182" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">    harness.cc parser.cc -o fuzz_parser</text>
<text x="38" y="264" fill="#6fcf97" font-family="ui-monospace, monospace" font-size="18" letter-spacing="1">02  RUN WITH A CORPUS</text>
<text x="38" y="305" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">$ mkdir -p corpus artifacts</text>
<text x="38" y="336" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">$ ./fuzz_parser corpus -max_total_time=60 \</text>
<text x="38" y="367" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">    -artifact_prefix=artifacts/</text>
<text x="38" y="418" fill="#6fcf97" font-family="ui-monospace, monospace" font-size="18" letter-spacing="1">03  REPLAY A SAVED INPUT</text>
<text x="38" y="459" fill="#e8e6e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" xml:space="preserve">$ ./fuzz_parser artifacts/crash-&lt;hash&gt;</text>
<path d="M38 569H1002" stroke="#30332e"/>
<text x="38" y="599" fill="#aaa59e" font-family="ui-monospace, monospace" font-size="16">Example filenames and prepared inputs. No run results or benchmark data.</text>
</svg>
