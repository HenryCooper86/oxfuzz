# Dependency update automation. Weekly PRs, grouped so a routine minor/patch
# bump is one PR per ecosystem rather than a swarm. Majors stay separate so a
# breaking bump is reviewed on its own.
#
# Three ecosystems, matching the three things CI installs: the Rust workspace,
# the desktop frontend under crates/hf-gui, and the GitHub Actions pinned by the
# workflows in this directory.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/crates/hf-gui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns:
          - "*"
