name: GUI demo - kernel campaign with KVM

# Records the website demo of a syzkaller kernel campaign started from the
# released Linux desktop app on an x86_64 host with /dev/kvm. The app runs on
# a virtual X display (Xvfb), tauri-driver drives it over WebDriver
# (scripts/demo/drive_kernel_demo.py), and ffmpeg records the display.
#
# What this is and is not:
# - By default the app is the published v0.9.13 .deb, unmodified. With
#   app_source=commit it is a .deb built here from the dispatched commit (to
#   show unreleased GUI changes); app-identity.txt records which. The sandbox
#   image is the published GHCR 0.2.4 image, pulled with scripts/pull-sandbox.sh.
# - The kernel is built from kernel-kvm.yml's recipe (cached); the Debian
#   rootfs and its SSH key are built here for this run. Neither, nor the key,
#   is uploaded: the artifact holds the video, screenshots, page sources,
#   the step log and host evidence only.
# - No provider, model or secret is used. HF_AUTO_APPROVE is never set: the
#   campaign goes through the app's own approval prompt, which the driver
#   answers, as the user allowed for the demo test kernel on 2026-11-25.
#
# Manual. GitHub dispatches a workflow only from the default branch.

on:
  workflow_dispatch:
    inputs:
      campaign_minutes:
        description: "Campaign length in minutes"
        type: number
        default: 10
      ui_only:
        description: "Stop before launching (selector check, no campaign)"
        type: boolean
        default: false
      app_source:
        description: "Desktop app: the published release .deb, or one built from this commit"
        type: choice
        options: [release, commit]
        default: release

concurrency:
  group: gui-demo-kvm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LINUX_VERSION: 6.12.118
  LINUX_SHA256: 08308460320e852ac0745b2be3c7ae1cd81bdad713506ed7d817ba1ec9e1a5a5
  KERNEL_RECIPE: x86_64-kcov-kasan-r1
  CREATE_IMAGE_SHA256: be1588c107f8fa096cdd8c81eefddc46d789ea83ab3f082ba1c5b89b4f2ddf34
  ROOTFS_RELEASE: bookworm
  RELEASE_TAG: v0.9.13
  DISPLAY: ":99"

jobs:
  build-deb:
    name: Build the .deb from this commit
    if: inputs.app_source == 'commit'
    # Same glibc floor and recipe as the release build in release.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: scripts/ci/install-linux-deps.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/hf-gui/package-lock.json

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: demo-deb-x86_64-unknown-linux-gnu

      - name: Build the .deb
        working-directory: crates/hf-gui
        run: |
          set -euo pipefail
          npm ci
          npx tauri build --ci --bundles deb
          ls -l ../../target/release/bundle/deb/

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: demo-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  record:
    name: Record the kernel demo
    needs: [build-deb]
    # Runs after build-deb, or without it when the release .deb is used.
    if: ${{ !cancelled() && (needs.build-deb.result == 'success' || needs.build-deb.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Paths
        run: |
          {
            echo "ARTIFACTS=$RUNNER_TEMP/kernel-artifacts"
            echo "DEMO=$RUNNER_TEMP/demo"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kernel-artifacts" "$RUNNER_TEMP/demo"

      - name: Enable KVM for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee "$DEMO/kvm-device.txt"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      # Same recipe and cache key as kernel-kvm.yml. Caches are scoped to the
      # branch that saved them, so the first run on main builds the kernel.
      - name: Restore a kernel built from the same recipe
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernel-out
          key: kvm-kernel-${{ env.LINUX_VERSION }}-${{ env.KERNEL_RECIPE }}

      - name: Build the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison bc libelf-dev libssl-dev
          build="$RUNNER_TEMP/kernel-build"
          out="$RUNNER_TEMP/kernel-out"
          mkdir -p "$build" "$out"
          cd "$build"
          curl -fsSL --retry 3 -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"
          echo "${LINUX_SHA256}  linux.tar.xz" | sha256sum -c -
          tar -xf linux.tar.xz
          cd "linux-${LINUX_VERSION}"
          make defconfig
          make kvm_guest.config
          ./scripts/config \
            -e CONFIG_KCOV \
            -e CONFIG_KCOV_INSTRUMENT_ALL \
            -e CONFIG_KCOV_ENABLE_COMPARISONS \
            -e CONFIG_DEBUG_INFO_DWARF4 \
            -e CONFIG_KASAN \
            -e CONFIG_KASAN_INLINE \
            -e CONFIG_CONFIGFS_FS \
            -e CONFIG_SECURITYFS \
            -e CONFIG_DEBUG_FS \
            -e CONFIG_BINFMT_MISC \
            -e CONFIG_NET_9P \
            -e CONFIG_NET_9P_VIRTIO \
            -e CONFIG_CMDLINE_BOOL
          make olddefconfig
          for option in KCOV KCOV_INSTRUMENT_ALL KCOV_ENABLE_COMPARISONS KASAN \
            KASAN_INLINE CONFIGFS_FS SECURITYFS DEBUG_FS BINFMT_MISC KVM_GUEST; do
            grep -qx "CONFIG_${option}=y" .config || { echo "CONFIG_${option} is not set" >&2; exit 1; }
          done
          started=$SECONDS
          make -j"$(nproc)" bzImage
          cp arch/x86/boot/bzImage "$out/bzImage"
          cp .config "$out/kernel.config"
          {
            echo "linux_version=${LINUX_VERSION}"
            echo "linux_tarball_sha256=${LINUX_SHA256}"
            echo "kernel_recipe=${KERNEL_RECIPE}"
            echo "bzImage_sha256=$(sha256sum "$out/bzImage" | cut -d' ' -f1)"
            echo "kernel_config_sha256=$(sha256sum "$out/kernel.config" | cut -d' ' -f1)"
            echo "compiler=$(gcc --version | head -n 1)"
            echo "build_seconds=$((SECONDS - started))"
            echo "build_cpus=$(nproc)"
            echo "built_by_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built_from_commit=${GITHUB_SHA}"
            grep -E '^CONFIG_(DEBUG_INFO[A-Z0-9_]*|KASAN[A-Z_]*|KCOV[A-Z_]*)=' .config | sed 's/^/config: /'
          } > "$out/identity.txt"
          cat "$out/identity.txt"

      - name: Save the kernel
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernel-out
          key: kvm-kernel-${{ env.LINUX_VERSION }}-${{ env.KERNEL_RECIPE }}

      - name: Install the display, recorder and WebDriver tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool ffmpeg webkit2gtk-driver dbus-x11 at-spi2-core \
            debootstrap debian-archive-keyring fonts-noto-core fonts-noto-cjk
          cargo install tauri-driver --locked
          which WebKitWebDriver tauri-driver

      - name: Download the .deb built from this commit
        if: inputs.app_source == 'commit'
        uses: actions/download-artifact@v4
        with:
          name: demo-deb
          path: ${{ runner.temp }}/release

      - name: Install the desktop app
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCE: ${{ inputs.app_source }}
        run: |
          set -euo pipefail
          if [ "$APP_SOURCE" != commit ]; then
            gh release download "$RELEASE_TAG" --pattern 'oxfuzz_*_amd64.deb' --pattern SHA256SUMS.txt \
              --dir "$RUNNER_TEMP/release" || gh release download "$RELEASE_TAG" --pattern 'oxfuzz_*_amd64.deb' \
              --dir "$RUNNER_TEMP/release"
          fi
          ls -l "$RUNNER_TEMP/release"
          sudo apt-get install -y "$RUNNER_TEMP"/release/oxfuzz_*_amd64.deb
          app="$(dpkg -L oxfuzz | grep -E '^/usr/bin/' | head -n 1)"
          test -x "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          {
            echo "app=$app"
            echo "app_source=$APP_SOURCE"
            echo "commit=$GITHUB_SHA"
            echo "deb_sha256=$(sha256sum "$RUNNER_TEMP"/release/oxfuzz_*_amd64.deb | cut -d' ' -f1)"
            dpkg -s oxfuzz | grep -E '^(Package|Version|Architecture):'
          } | tee "$DEMO/app-identity.txt"

      - name: Pull the published sandbox image
        run: |
          set -euo pipefail
          ./scripts/pull-sandbox.sh 2>&1 | tee "$DEMO/pull-sandbox.log"

      - name: Stage the kernel and build the Debian rootfs
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/kernel-out/bzImage" "$ARTIFACTS/bzImage"
          cp "$RUNNER_TEMP/kernel-out/identity.txt" "$DEMO/kernel-identity.txt"
          commit="$(grep -oE '^ARG SYZKALLER_COMMIT=[0-9a-f]{40}$' docker/sandbox/Dockerfile | cut -d= -f2)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/create-image.sh" \
            "https://raw.githubusercontent.com/google/syzkaller/${commit}/tools/create-image.sh"
          echo "${CREATE_IMAGE_SHA256}  $RUNNER_TEMP/create-image.sh" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rootfs-build"
          cd "$RUNNER_TEMP/rootfs-build"
          bash "$RUNNER_TEMP/create-image.sh" --distribution "$ROOTFS_RELEASE" --output rootfs \
            > "$RUNNER_TEMP/rootfs-build.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/rootfs-build.log"; exit 1; }
          mv rootfs.img rootfs.id_rsa "$ARTIFACTS/"
          sudo rm -rf rootfs rootfs.id_rsa.pub
          echo "rootfs_sha256=$(sha256sum "$ARTIFACTS/rootfs.img" | cut -d' ' -f1)" | tee "$DEMO/rootfs-identity.txt"

      - name: App configuration
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/oxfuzz-config"
          mkdir -p "$config" "$RUNNER_TEMP/oxfuzz-app" "$RUNNER_TEMP/linux-kernel"
          printf '[fuzzing.sandbox]\nmax_cpus = 2\nmax_mem_mb = 6144\nmax_duration_secs = 7200\n' \
            > "$config/oxfuzz.toml"
          printf 'Kernel campaign demo project.\n' > "$RUNNER_TEMP/linux-kernel/README.txt"
          cp "$config/oxfuzz.toml" "$DEMO/oxfuzz.toml"
          {
            echo "HF_CONFIG_DIR=$config"
            echo "HF_APP_DIR=$RUNNER_TEMP/oxfuzz-app"
          } >> "$GITHUB_ENV"

      - name: Record
        id: record
        env:
          CAMPAIGN_MINUTES: ${{ inputs.campaign_minutes || 10 }}
          UI_ONLY: ${{ inputs.ui_only && '--ui-only' || '' }}
        run: |
          set -uo pipefail
          Xvfb "$DISPLAY" -screen 0 1280x880x24 -nolisten tcp > "$DEMO/xvfb.log" 2>&1 &
          sleep 2
          eval "$(dbus-launch --sh-syntax)"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
          tauri-driver --port 4444 > "$DEMO/tauri-driver.log" 2>&1 &
          sleep 2
          ffmpeg -nostdin -loglevel error -f x11grab -framerate 15 -video_size 1280x880 -i "$DISPLAY" \
            -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p "$DEMO/screen.mkv" &
          recorder=$!
          # Evidence that the guest runs under KVM: qemu's command line and
          # its open KVM descriptors, taken once qemu appears.
          (
            while true; do
              pid="$(pgrep -x qemu-system-x86 | head -n 1 || true)"
              if [[ -n "$pid" ]]; then
                tr '\0' ' ' < "/proc/$pid/cmdline" > "$DEMO/qemu-cmdline.txt"
                sudo ls -l "/proc/$pid/fd" | grep -E 'kvm' > "$DEMO/qemu-kvm-fds.txt" || true
                break
              fi
              sleep 5
            done
          ) &
          # The step shell runs with -e; capture the driver's status so the
          # recorder is always stopped and its file finalized.
          status=0
          python3 -I scripts/demo/drive_kernel_demo.py --app "$APP" \
            --project "$RUNNER_TEMP/linux-kernel" --kernel "$ARTIFACTS/bzImage" \
            --rootfs "$ARTIFACTS/rootfs.img" --ssh-key "$ARTIFACTS/rootfs.id_rsa" \
            --duration-minutes "$CAMPAIGN_MINUTES" --out "$DEMO/steps" $UI_ONLY || status=$?
          kill -INT "$recorder"; wait "$recorder" || true
          xdotool search --name oxfuzz getwindowgeometry 2>/dev/null | tee "$DEMO/window-geometry.txt" || true
          pgrep -a qemu-system || true
          echo "driver_exit=$status" | tee "$DEMO/driver-exit.txt"
          exit "$status"

      - name: Campaign evidence from the app state
        if: always()
        run: |
          set -uo pipefail
          find "$RUNNER_TEMP/oxfuzz-app" -maxdepth 3 -type d | head -50 > "$DEMO/app-dirs.txt"
          find "$RUNNER_TEMP/linux-kernel" -maxdepth 4 \( -name '*.log' -o -name 'manager.cfg' \) \
            -size -2M -exec cp --parents {} "$DEMO/" \; 2>/dev/null || true
          grep -hoE 'accel=(kvm|tcg)' "$DEMO/qemu-cmdline.txt" 2>/dev/null | tee "$DEMO/accel.txt" || true

      - name: Upload the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-demo-kvm
          path: |
            ${{ runner.temp }}/demo
            !${{ runner.temp }}/demo/**/*.id_rsa
          retention-days: 14
