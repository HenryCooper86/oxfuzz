name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy all targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Test all features
        run: ./scripts/cargo-test-filtered.sh --locked --workspace --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  sandbox-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Verify runtime isolation and qualification contracts
        run: |
          ./scripts/cargo-test-filtered.sh --locked -p hf-runtime
          ./scripts/cargo-test-filtered.sh --locked -p hf-service --test harness_qualification
          ./scripts/cargo-test-filtered.sh --locked -p hf-service --test release_readiness

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/hf-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/hf-gui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  automotive-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.9
          cache: pip
          cache-dependency-path: sidecars/scapy_automotive/requirements-dev.txt
      - name: Install pinned sidecar verification dependencies
        working-directory: sidecars/scapy_automotive
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Unit and wire-contract tests
        working-directory: sidecars/scapy_automotive
        run: python -m unittest discover -s tests -v
      - name: Python lint
        working-directory: sidecars/scapy_automotive
        run: ruff check --no-cache src tests
      - name: Build pinned sidecar image
        run: HOBOT_SCAPY_IMAGE=hobot/scapy-automotive:ci ./scripts/build-scapy-sidecar.sh
      - name: Smoke-test network-disabled sidecar entrypoint
        run: |
          printf '%s\n' '{"schema_version":1,"request_id":"ci-capabilities","operation":"capabilities","payload":{}}' \
            | docker run --rm --interactive --network none --read-only \
                --tmpfs /workspace/output:rw,noexec,nosuid,size=16m \
                hobot/scapy-automotive:ci \
            | grep '"ok":true'

  release-cli:
    runs-on: ubuntu-latest
    needs: [rust-quality, frontend, automotive-sidecar, sandbox-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build and verify release CLI
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hobot-fuzz-linux-cli
          path: target/release/hobot-fuzz
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
