name: Sandbox image

# Builds the fuzzing sandbox image (oxfuzz/fuzz-sandbox) natively for
# linux/amd64 and linux/arm64, verifies it with the same script a local build
# uses, and -- only when explicitly asked -- pushes it to GitHub Container
# Registry so users can run scripts/pull-sandbox.sh instead of building about
# 7 GB locally.
#
# Manual only. Publishing distributes the third-party binaries inside the
# image, including GPL-licensed components (SymCC, Ubuntu packages) and LGPL
# Semgrep. Confirm those obligations before ticking `publish`. The automotive
# Scapy sidecar image is not built or published here.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to ghcr.io after verification (license review done)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      # The image needs more scratch space than a hosted runner leaves free.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(grep -oE 'oxfuzz/fuzz-sandbox:[0-9][0-9A-Za-z._-]*' scripts/build-sandbox.sh | head -n 1 | cut -d: -f2)"
          test -n "$version"
          repo="ghcr.io/${OWNER,,}/oxfuzz-fuzz-sandbox"
          {
            echo "local=oxfuzz/fuzz-sandbox:${version}"
            echo "remote=${repo}:${version}-${ARCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify
        env:
          OXFUZZ_SANDBOX_IMAGE: ${{ steps.names.outputs.local }}
        run: ./scripts/build-sandbox.sh

      - name: Push
        if: inputs.publish
        env:
          LOCAL: ${{ steps.names.outputs.local }}
          REMOTE: ${{ steps.names.outputs.remote }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "$LOCAL" "$REMOTE"
          docker push "$REMOTE"

  manifest:
    name: Publish multi-arch tag
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Create and push the manifest list
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="$(grep -oE 'oxfuzz/fuzz-sandbox:[0-9][0-9A-Za-z._-]*' scripts/build-sandbox.sh | head -n 1 | cut -d: -f2)"
          test -n "$version"
          repo="ghcr.io/${OWNER,,}/oxfuzz-fuzz-sandbox"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "${repo}:${version}" \
            "${repo}:${version}-amd64" "${repo}:${version}-arm64"
          docker buildx imagetools inspect "${repo}:${version}"
