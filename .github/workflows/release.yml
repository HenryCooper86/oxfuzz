name: Release desktop app

# Builds the Tauri desktop app on each host OS and publishes the installers as a
# GitHub Release. Tauri does not cross-compile: Linux bundles need WebKitGTK on
# a Linux host and Windows bundles need the MSVC toolchain, so each platform
# gets its own runner.
#
# Trigger by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release publishes automatically, but only once every platform has
# uploaded. Three phases make that guarantee:
#
#   create-release  -> opens ONE draft and hands its id to the builders
#   bundle (matrix) -> each platform uploads into that same draft
#   publish-release -> flips the draft public after all builders succeed
#
# Letting each builder create its own release instead would publish the moment
# the first platform finished, leaving a public release missing the platforms
# still building -- roughly a five minute window at current build times.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the automatic token is used; no signing secrets are configured.
permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Open the draft release
        uses: actions/github-script@v9
        id: create
        env:
          # Kept in the environment rather than inlined into the script: the body
          # contains backticks, which would terminate a JS template literal.
          RELEASE_BODY: |
            Desktop builds of oxfuzz. Download the file for your platform below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux | `*.AppImage`, `*.deb`, `*.rpm` |
            | Windows | `*.msi`, `*-setup.exe` |

            ### These builds are not signed

            No code-signing certificates are configured, so the operating system
            will warn you on first launch. This is expected, not a sign the
            download is corrupt.

            - **macOS**: Gatekeeper blocks the first run. Right-click the app and
              choose **Open**, then confirm. Alternatively:
              `xattr -cr /Applications/oxfuzz.app`
            - **Windows**: SmartScreen shows a warning. Choose **More info**,
              then **Run anyway**.
            - **Linux**: mark the AppImage executable with
              `chmod +x oxfuzz_*.AppImage` before running it.

            ### Before you start fuzzing

            oxfuzz builds and runs untrusted code, so it requires a sandbox.
            Docker must be installed and running, and at least one LLM provider
            must be configured. See the Getting Started guide in the repository.

            ### Known Windows limitations

            Harness Work Order export reopens the selected project-root pathname
            after canonicalization. Another local process that can rename that
            root and create a directory junction in its parent could redirect the
            confined source read. Keep the selected project parent trusted and
            immutable during export, or avoid this export feature on Windows until
            root-handle hardening lands.

            Patch-to-Proof is unavailable on Windows in this release because
            secure handle-relative reads of retained crash evidence are not yet
            implemented. Use Patch-to-Proof on Linux or macOS; Windows fails
            closed instead of using a path-reopen fallback.
        with:
          result-encoding: string
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `oxfuzz ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            core.info(`Draft release ${data.id} created for ${tag}`);
            return data.id.toString();

  bundle:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing must not cancel the others: the rest still upload,
      # so a retry only has to cover the platform that broke.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Linux (x86_64)
            # Pinned rather than ubuntu-latest: this sets the glibc floor for the
            # .deb and .AppImage, and a newer runner would narrow compatibility.
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
          - label: Windows (x86_64)
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: scripts/ci/install-linux-deps.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/hf-gui/package-lock.json

      # No toolchain action here on purpose: rust-toolchain.toml pins 1.94.0, and
      # an action that installs a channel would silently override the pin.
      # `rustup target add` provisions the pinned toolchain on demand.
      - name: Add the Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/hf-gui

      # tauri-action shells out to `npm run tauri build`, so crates/hf-gui must
      # expose a `tauri` script -- build-app.sh calls node_modules/.bin/tauri
      # directly, so a missing script is invisible locally but fails CI instantly.
      #
      # tauri.conf.json already declares `beforeBuildCommand: npm run build`, so
      # the frontend is built by Tauri itself. `bundle.targets: "all"` makes each
      # host emit its native formats. src-tauri defaults to the automotive-scapy
      # and proof-carrying features, so no --features flag is needed.
      - name: Build the app and upload it to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/hf-gui
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish release
    # Depends on the whole matrix, so this job is unreachable unless every
    # platform uploaded. A failed platform leaves the release as a draft to
    # publish by hand or retry -- an incomplete release is never made public.
    needs: [create-release, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public
        uses: actions/github-script@v9
        with:
          script: |
            const releaseId = Number('${{ needs.create-release.outputs.release_id }}');
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
            });
            core.info(`Published ${data.html_url}`);
