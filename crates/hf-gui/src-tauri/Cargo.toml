[package]
name = "hf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop GUI for oxfuzz"

# Product capabilities are on by default; `--no-default-features` drops their
# presentation entrypoints.
[features]
managed-mutators = ["hf-service/managed-mutators", "hf-web?/managed-mutators"]
model-budgets = ["hf-service/model-budgets", "hf-web?/model-budgets"]
clang-analysis = ["hf-service/clang-analysis", "hf-web?/clang-analysis"]
campaign-allocation = ["hf-service/campaign-allocation", "hf-web?/campaign-allocation"]
default = ["managed-mutators", "model-budgets", "ai-target-ranking", "binary-only-fuzzing", "campaign-allocation", "automotive-lab", "automotive-scapy", "campaign-health", "build-context", "concolic-enrichment", "build-doctor", "campaign-trust", "change-aware", "coverage-blockers", "crash-alerts", "crash-bisection", "go-native-fuzzing", "harness-tournament", "harness-behavior", "harness-work-order", "jvm-jazzer", "js-jazzer", "native-analysis", "oracle-studio", "patch-to-proof", "proof-carrying", "python-atheris", "run-closeout", "triage-disposition", "control-replay", "unreached-surface", "rest-server"]
ai-target-ranking = ["hf-service/ai-target-ranking", "hf-web?/ai-target-ranking"]
automotive-scapy = ["hf-service/automotive-scapy", "hf-web?/automotive-scapy"]
build-context = ["hf-service/build-context", "hf-web?/build-context"]
build-doctor = ["build-context", "hf-service/build-doctor", "hf-web?/build-doctor"]
coverage-blockers = ["hf-service/coverage-blockers", "hf-web?/coverage-blockers"]
automotive-lab = ["automotive-scapy", "hf-service/automotive-lab", "hf-web?/automotive-lab"]
oracle-studio = ["hf-service/oracle-studio", "hf-web?/oracle-studio"]
harness-tournament = ["hf-service/harness-tournament", "hf-web?/harness-tournament"]
harness-behavior = ["hf-service/harness-behavior", "hf-web?/harness-behavior"]
change-aware = ["proof-carrying", "hf-service/change-aware", "hf-web?/change-aware"]
native-analysis = ["hf-service/native-analysis", "hf-web?/native-analysis"]
proof-carrying = ["hf-service/proof-carrying", "hf-web?/proof-carrying"]
patch-to-proof = ["proof-carrying", "hf-service/patch-to-proof", "hf-web?/patch-to-proof"]
semgrep-enrichment = ["hf-service/semgrep-enrichment", "hf-web?/semgrep-enrichment"]
triage-disposition = ["proof-carrying", "hf-service/triage-disposition", "hf-web?/triage-disposition"]
control-replay = ["triage-disposition", "hf-service/control-replay", "hf-web?/control-replay"]
campaign-trust = ["triage-disposition", "hf-service/campaign-trust", "hf-web?/campaign-trust"]
unreached-surface = ["coverage-blockers", "hf-service/unreached-surface", "hf-web?/unreached-surface"]
go-native-fuzzing = ["hf-service/go-native-fuzzing", "hf-web?/go-native-fuzzing"]
python-atheris = ["hf-service/python-atheris", "hf-web?/python-atheris"]
jvm-jazzer = ["hf-service/jvm-jazzer", "hf-web?/jvm-jazzer"]
js-jazzer = ["hf-service/js-jazzer", "hf-web?/js-jazzer"]
binary-only-fuzzing = ["hf-service/binary-only-fuzzing", "hf-web?/binary-only-fuzzing"]
crash-bisection = ["hf-service/crash-bisection", "hf-web?/crash-bisection"]
crash-alerts = ["hf-service/crash-alerts", "hf-web?/crash-alerts"]
campaign-health = ["hf-service/campaign-health", "hf-web?/campaign-health"]
concolic-enrichment = ["hf-service/concolic-enrichment", "hf-web?/concolic-enrichment"]
run-closeout = ["campaign-trust", "campaign-health", "unreached-surface", "hf-service/run-closeout", "hf-web?/run-closeout"]
harness-work-order = ["build-context", "hf-service/harness-work-order", "hf-web?/harness-work-order"]
# Hosts the REST API from the desktop app, as `oxfuzz serve` does.
rest-server = ["dep:hf-web", "dep:axum"]

[lib]
name = "hf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }


[dependencies]
# Tauri
# `unstable` enables the multi-webview API (`Window::add_child`) used to embed the
# DefectDojo web UI as a child webview inside the main window.
tauri = { version = "2.11", features = ["macos-private-api", "devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Identifiers
uuid = { workspace = true }
chrono = { workspace = true }

# Internal service facade
hf-service = { workspace = true }
hf-web = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
hf-service = { workspace = true, features = ["test-support"] }
tauri = { version = "2.11", features = ["test"] }
tempfile = { workspace = true }

# Tauri's command ABI requires deserializable owned arguments and injects
# `tauri::State` by value. Keep that framework exception at the presentation
# crate boundary rather than scattering inline suppressions across commands.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"
undocumented_unsafe_blocks = "deny"

[lints.rust]
unused_assignments = "allow"
