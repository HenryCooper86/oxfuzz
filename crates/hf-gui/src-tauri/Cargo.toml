[package]
name = "hf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop GUI for oxfuzz"

# Product capabilities are on by default; `--no-default-features` drops their
# presentation entrypoints.
[features]
default = ["automotive-lab", "automotive-scapy", "campaign-health", "build-context", "build-doctor", "campaign-trust", "change-aware", "coverage-blockers", "harness-tournament", "native-analysis", "oracle-studio", "patch-to-proof", "proof-carrying", "semgrep-enrichment", "triage-disposition", "unreached-surface"]
automotive-scapy = ["hf-service/automotive-scapy"]
build-context = ["hf-service/build-context"]
build-doctor = ["build-context", "hf-service/build-doctor"]
coverage-blockers = ["hf-service/coverage-blockers"]
automotive-lab = ["automotive-scapy", "hf-service/automotive-lab"]
oracle-studio = ["hf-service/oracle-studio"]
harness-tournament = ["hf-service/harness-tournament"]
change-aware = ["proof-carrying", "hf-service/change-aware"]
native-analysis = ["hf-service/native-analysis"]
proof-carrying = ["hf-service/proof-carrying"]
patch-to-proof = ["proof-carrying", "hf-service/patch-to-proof"]
semgrep-enrichment = ["hf-service/semgrep-enrichment"]
triage-disposition = ["proof-carrying", "hf-service/triage-disposition"]
campaign-trust = ["triage-disposition", "hf-service/campaign-trust"]
unreached-surface = ["coverage-blockers", "hf-service/unreached-surface"]
campaign-health = ["hf-service/campaign-health"]

[lib]
name = "hf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri
# `unstable` enables the multi-webview API (`Window::add_child`) used to embed the
# DefectDojo web UI as a child webview inside the main window.
tauri = { version = "2.11", features = ["macos-private-api", "devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Identifiers
uuid = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Internal service facade
hf-service = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tauri's command ABI requires deserializable owned arguments and injects
# `tauri::State` by value. Keep that framework exception at the presentation
# crate boundary rather than scattering inline suppressions across commands.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"
undocumented_unsafe_blocks = "deny"

[lints.rust]
unused_assignments = "allow"
