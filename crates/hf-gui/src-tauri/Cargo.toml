[package]
name = "hf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop GUI for hobot_fuzz"

[features]
default = []
automotive-scapy = ["hf-service/automotive-scapy"]

[lib]
name = "hf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri
# `unstable` enables the multi-webview API (`Window::add_child`) used to embed the
# DefectDojo web UI as a child webview inside the main window.
tauri = { version = "2.11", features = ["macos-private-api", "devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Identifiers
uuid = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Internal service facade
hf-service = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
