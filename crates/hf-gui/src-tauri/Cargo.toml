[package]
name = "hf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop GUI for hobot_fuzz"

[lib]
name = "hf_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11", features = ["macos-private-api", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Identifiers
uuid = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Internal crates
hf-core = { workspace = true }
hf-discovery = { workspace = true }
hf-harness = { workspace = true }
hf-engine = { workspace = true }
hf-crash = { workspace = true }
hf-corpus = { workspace = true }
hf-runtime = { workspace = true }
hf-service = { workspace = true }
hf-provider = { workspace = true }
hf-agent = { workspace = true }
hf-skills = { workspace = true }
hf-guardrails = { workspace = true }

[lints]
workspace = true
