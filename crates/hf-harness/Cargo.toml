description = "Harness generation, compile validation, smoke fuzz"

[features]
managed-mutators = ["hf-engine/managed-mutators"]

[dependencies]
hf-core = { workspace = true }
hf-prompt = { workspace = true }
hf-engine = { workspace = true }
hf-crash = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
