[package]
name = "hf-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Business logic orchestrating discovery, harness, engine, crash, corpus, coverage"

# Automotive on by default; `--no-default-features` drops the optional
# hf-automotive dependency and compiles the feature-absent orchestration paths.
[features]
default = ["automotive-lab", "automotive-scapy", "campaign-health", "build-context", "concolic-enrichment", "build-doctor", "campaign-trust", "change-aware", "coverage-blockers", "harness-tournament", "harness-work-order", "native-analysis", "oracle-studio", "patch-to-proof", "proof-carrying", "run-closeout", "semgrep-enrichment", "triage-disposition", "unreached-surface"]
automotive-scapy = ["dep:hf-automotive", "hf-automotive/automotive-scapy"]
build-context = ["hf-discovery/build-context"]
build-doctor = ["build-context"]
coverage-blockers = []
automotive-lab = ["automotive-scapy"]
oracle-studio = []
harness-tournament = []
change-aware = ["proof-carrying"]
native-analysis = ["hf-discovery/native-analysis"]
proof-carrying = ["hf-coverage/campaign-advisor", "hf-crash/remediation-handoff"]
patch-to-proof = ["proof-carrying"]
semgrep-enrichment = ["hf-discovery/semgrep-enrichment"]
triage-disposition = ["proof-carrying"]
campaign-trust = ["triage-disposition"]
unreached-surface = ["coverage-blockers"]
campaign-health = []
concolic-enrichment = []
run-closeout = ["campaign-trust", "campaign-health", "unreached-surface", "coverage-blockers"]
harness-work-order = ["build-context"]
test-support = []

[dependencies]
hf-core = { workspace = true }
hf-agent = { workspace = true }
hf-skills = { workspace = true }
hf-discovery = { workspace = true }
hf-harness = { workspace = true }
hf-engine = { workspace = true }
hf-crash = { workspace = true }
hf-corpus = { workspace = true }
hf-coverage = { workspace = true }
hf-provider = { workspace = true }
hf-knowledge = { workspace = true }
hf-prompt = { workspace = true }
hf-diagnostics = { workspace = true }
hf-scheduler = { workspace = true }
ignore = { workspace = true }
hf-session = { workspace = true }
hf-storage = { workspace = true }
hf-runtime = { workspace = true }
hf-guardrails = { workspace = true }
hf-automotive = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
comrak = { workspace = true }
# DefectDojo REST client (findings push). `multipart` is additive to the
# workspace reqwest features so the file upload to /api/v2/import-scan works.
reqwest = { workspace = true, features = ["multipart"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
cap-primitives = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
hf-test-utils = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
