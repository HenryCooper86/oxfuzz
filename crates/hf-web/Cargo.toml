[package]
name = "hf-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API + SSE streaming"

[dependencies]
hf-core = { workspace = true }
hf-service = { workspace = true }
hf-runtime = { workspace = true }
hf-harness = { workspace = true }
hf-discovery = { workspace = true }
hf-corpus = { workspace = true }
hf-crash = { workspace = true }
# The agent loop lives in hf-agent; presentation layers call its shared
# `run_chat_turn` entry point (hf-service cannot host it -- hf-agent depends on
# hf-service, which would be a cycle).
hf-agent = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }

[lints]
workspace = true