[package]
name = "hf-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API + SSE streaming"

# Automotive on by default; `--no-default-features` drops it (see hf-cli note).
[features]
default = ["automotive-lab", "automotive-scapy", "campaign-health", "build-context", "concolic-enrichment", "build-doctor", "campaign-trust", "change-aware", "coverage-blockers", "harness-tournament", "harness-work-order", "native-analysis", "oracle-studio", "patch-to-proof", "proof-carrying", "run-closeout", "semgrep-enrichment", "triage-disposition", "unreached-surface"]
automotive-scapy = ["hf-service/automotive-scapy"]
build-context = ["hf-service/build-context"]
build-doctor = ["build-context", "hf-service/build-doctor"]
coverage-blockers = ["hf-service/coverage-blockers"]
automotive-lab = ["automotive-scapy", "hf-service/automotive-lab"]
oracle-studio = ["hf-service/oracle-studio"]
harness-tournament = ["hf-service/harness-tournament"]
change-aware = ["proof-carrying", "hf-service/change-aware"]
native-analysis = ["hf-service/native-analysis"]
proof-carrying = ["hf-service/proof-carrying"]
patch-to-proof = ["proof-carrying", "hf-service/patch-to-proof"]
semgrep-enrichment = ["hf-service/semgrep-enrichment"]
triage-disposition = ["proof-carrying", "hf-service/triage-disposition"]
campaign-trust = ["triage-disposition", "hf-service/campaign-trust"]
unreached-surface = ["coverage-blockers", "hf-service/unreached-surface"]
campaign-health = ["hf-service/campaign-health"]
concolic-enrichment = ["hf-service/concolic-enrichment"]
run-closeout = ["campaign-trust", "campaign-health", "unreached-surface", "hf-service/run-closeout"]
harness-work-order = ["build-context", "hf-service/harness-work-order"]

[dependencies]
hf-service = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
hf-service = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
