[package]
name = "hf-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API + SSE streaming"

# Automotive on by default; `--no-default-features` drops it (see hf-cli note).
[features]
default = ["automotive-scapy", "build-context", "native-analysis", "proof-carrying", "semgrep-enrichment"]
automotive-scapy = ["hf-service/automotive-scapy"]
build-context = ["hf-service/build-context"]
native-analysis = ["hf-service/native-analysis"]
proof-carrying = ["hf-service/proof-carrying"]
semgrep-enrichment = ["hf-service/semgrep-enrichment"]

[dependencies]
hf-service = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
hf-service = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
