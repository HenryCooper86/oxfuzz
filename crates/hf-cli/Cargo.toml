[package]
name = "hf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI + TUI for hobot_fuzz"

[[bin]]
name = "hobot-fuzz"
path = "src/main.rs"

[dependencies]
# The CLI is a thin presentation layer: domain crates are reached through
# hf-service, not depended on directly. hf-discovery is used only by the TUI.
hf-core = { workspace = true }
hf-service = { workspace = true }
hf-discovery = { workspace = true }
hf-web = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[lints]
workspace = true
