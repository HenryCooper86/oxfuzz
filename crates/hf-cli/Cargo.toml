[package]
name = "hf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI + TUI for oxfuzz"

[features]
default = []
automotive-scapy = ["hf-service/automotive-scapy", "hf-web/automotive-scapy"]

[[bin]]
name = "oxfuzz"
path = "src/main.rs"

[dependencies]
# The CLI is a thin presentation layer: domain crates are reached through
# hf-service, not depended on directly.
hf-service = { workspace = true }
hf-web = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[lints]
workspace = true
