[package]
name = "hf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI + TUI for oxfuzz"

# Automotive ships on by default so the CAN/UDS workspace is a first-class part
# of every build (including `cargo build`/dev). Build with `--no-default-features`
# to drop the pure-Rust automotive dependency and use the feature-absent paths.
[features]
default = ["automotive-lab", "automotive-scapy", "campaign-health", "build-context", "concolic-enrichment", "build-doctor", "campaign-trust", "change-aware", "coverage-blockers", "harness-tournament", "harness-work-order", "native-analysis", "oracle-studio", "patch-to-proof", "proof-carrying", "run-closeout", "semgrep-enrichment", "triage-disposition", "unreached-surface"]
automotive-scapy = ["hf-service/automotive-scapy", "hf-web/automotive-scapy"]
build-context = ["hf-service/build-context", "hf-web/build-context"]
build-doctor = ["build-context", "hf-service/build-doctor", "hf-web/build-doctor"]
coverage-blockers = ["hf-service/coverage-blockers", "hf-web/coverage-blockers"]
automotive-lab = ["automotive-scapy", "hf-service/automotive-lab", "hf-web/automotive-lab"]
oracle-studio = ["hf-service/oracle-studio", "hf-web/oracle-studio"]
harness-tournament = ["hf-service/harness-tournament", "hf-web/harness-tournament"]
change-aware = ["proof-carrying", "hf-service/change-aware", "hf-web/change-aware"]
native-analysis = ["hf-service/native-analysis", "hf-web/native-analysis"]
proof-carrying = ["hf-service/proof-carrying", "hf-web/proof-carrying"]
patch-to-proof = ["proof-carrying", "hf-service/patch-to-proof", "hf-web/patch-to-proof"]
semgrep-enrichment = [
    "hf-service/semgrep-enrichment",
    "hf-web/semgrep-enrichment",
]
triage-disposition = [
    "proof-carrying",
    "hf-service/triage-disposition",
    "hf-web/triage-disposition",
]
campaign-trust = [
    "triage-disposition",
    "hf-service/campaign-trust",
    "hf-web/campaign-trust",
]
unreached-surface = [
    "coverage-blockers",
    "hf-service/unreached-surface",
    "hf-web/unreached-surface",
]
campaign-health = [
    "hf-service/campaign-health",
    "hf-web/campaign-health",
]
concolic-enrichment = [
    "hf-service/concolic-enrichment",
    "hf-web/concolic-enrichment",
]
run-closeout = [
    "campaign-trust",
    "campaign-health",
    "unreached-surface",
    "hf-service/run-closeout",
    "hf-web/run-closeout",
]
harness-work-order = [
    "build-context",
    "dep:rustix",
    "hf-service/harness-work-order",
    "hf-web/harness-work-order",
]

[[bin]]
name = "oxfuzz"
path = "src/main.rs"

[dependencies]
# The CLI is a thin presentation layer: domain crates are reached through
# hf-service, not depended on directly.
hf-service = { workspace = true }
hf-web = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
