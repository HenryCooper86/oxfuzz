[package]
name = "hf-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Target discovery: static analysis, semantic ranking, Target Inventory"

[features]
default = []
build-context = []
native-analysis = ["dep:hf-analysis"]
semgrep-enrichment = []

[dependencies]
hf-core = { workspace = true }
hf-analysis = { workspace = true, optional = true }
hf-provider = { workspace = true }
hf-prompt = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
futures = { workspace = true }

[lints]
workspace = true
