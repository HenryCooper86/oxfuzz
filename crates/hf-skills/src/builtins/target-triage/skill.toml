[skill]
name = "target-triage"
version = "0.1.0"
description = "Rank functions in a project by fuzzing fit"
author = "oxfuzz"
source_format = "markdown"

[skill.classification]
type = "llm_reasoning"
domain = ["fuzzing", "static-analysis", "target-discovery"]
atomic = true

[skill.constraints]
max_input_tokens = 12000
max_output_tokens = 4000

[skill.root]
path = "root.md"
token_count = 480
