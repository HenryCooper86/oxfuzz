stages:
  - quality
  - contract
  - frontend
  - supply-chain

default:
  interruptible: true

.rust-job:
  image: rust:1.94-bookworm
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/
  before_script:
    - rustup component add rustfmt clippy
    - apt-get update
    - apt-get install -y --no-install-recommends afl++ honggfuzz libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

rust-quality:
  extends: .rust-job
  stage: quality
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace -- -D warnings
    - cargo check --workspace
    - bash -o pipefail -c "cargo test --workspace 2>&1 | grep -v '^\\s*Compiling\\|^\\s*Running\\|^\\s*Downloading\\|^\\s*Downloaded\\|^\\s*Blocking\\|^\\s*Finished\\|^\\s*Doc-tests\\|^running\\|^test \\|^$' | head -200"
    - cargo doc --workspace --no-deps

sandbox-contract:
  extends: .rust-job
  stage: contract
  script:
    - bash -o pipefail -c "cargo test -p hf-runtime 2>&1 | grep -v '^\\s*Compiling\\|^\\s*Running\\|^\\s*Downloading\\|^\\s*Downloaded\\|^\\s*Blocking\\|^\\s*Finished\\|^\\s*Doc-tests\\|^running\\|^test \\|^$' | head -200"
    - bash -o pipefail -c "cargo test -p hf-service --test harness_qualification 2>&1 | grep -v '^\\s*Compiling\\|^\\s*Running\\|^\\s*Downloading\\|^\\s*Downloaded\\|^\\s*Blocking\\|^\\s*Finished\\|^\\s*Doc-tests\\|^running\\|^test \\|^$' | head -200"

frontend:
  image: node:22-bookworm
  stage: frontend
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  script:
    - npm --prefix crates/hf-gui ci --cache .npm --prefer-offline
    - npm --prefix crates/hf-gui test
    - npm --prefix crates/hf-gui run build
    - npm --prefix crates/hf-gui run lint

supply-chain:
  extends: .rust-job
  stage: supply-chain
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

