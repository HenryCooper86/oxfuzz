# DefectDojo integration
#
# Push triaged crashes to a DefectDojo instance (https://www.defectdojo.org) as
# findings via its REST API. hobot_fuzz maps each triaged crash -- its CWE, CASR
# exploitability, stack signature, and suggested fix -- to a DefectDojo "Generic
# Findings Import" finding and POSTs it to /api/v2/import-scan/ (or
# /reimport-scan/ on repeat pushes, so re-found crashes update in place instead
# of piling up as duplicates).
#
# The API token is NEVER stored in this file. Set `api_token_env` to the NAME of
# an environment variable that holds the token, and export that variable in your
# shell / .env. This mirrors how provider API keys are handled (api_key_env).

# Base URL of your DefectDojo instance (no trailing /api/v2 and no trailing /).
url = "https://defectdojo.example.com"

# API v2 token. Two ways to supply it (a direct `api_token` takes priority):
#
#   1. Env var (preferred for CLI/CI -- secret stays out of this file). Set
#      `api_token_env` to the NAME of the variable and export it:
#        export HF_DEFECTDOJO_TOKEN=1a2b3c...
#   2. Direct (for the desktop app, which has no shell environment). Paste the
#      token into `api_token` -- stored with your settings, like a provider key.
#
# Create a token in DefectDojo under your profile -> "API v2 Key".
api_token_env = "HF_DEFECTDOJO_TOKEN"
# api_token = "1a2b3c..."

# Verify the server's TLS certificate. Set to false ONLY for a self-signed
# certificate on a trusted on-prem instance.
verify_tls = true

# Product / engagement the findings are filed under. When auto_create = true,
# DefectDojo creates them on first push if they do not already exist, so you do
# not have to pre-provision anything. Leave product_name empty to default it to
# the fuzzed project's name.
product_name = "hobot_fuzz"
# Product type the product is filed under. DefectDojo requires this to create a
# brand-new product under auto_create; it is created on demand if it does not
# already exist. Defaults to "hobot_fuzz" when blank.
product_type_name = "hobot_fuzz"
engagement_name = "Fuzzing"
auto_create = true

# Reimport (recommended). On repeat pushes to the same product/engagement/test,
# DefectDojo dedups re-found crashes by their stack signature
# (unique_id_from_tool) and closes crashes that no longer reproduce, instead of
# accumulating duplicates. Set false to always create a fresh import.
reimport = true

# ---------------------------------------------------------------------------
# Local instance lifecycle
# ---------------------------------------------------------------------------
# hobot_fuzz ships no DefectDojo server. What it can do is adopt one you already
# installed with upstream's `docker compose` and start it alongside the app, so
# the embedded DefectDojo view and the crash push are not staring at a dead port.
# Only a local `url` (localhost / 127.0.0.1) is ever started or stopped -- a
# remote DefectDojo belongs to whoever operates it.

[lifecycle]
# Start the local instance when the app starts.
autostart = true

# The `docker compose -p` project name of your install. Upstream's default is
# "defectdojo"; leave blank to use it.
compose_project = "defectdojo"

# Compose files of your install. Leave empty to discover them from the existing
# project's Docker labels -- a standard upstream install needs no entry here.
# Set explicitly only for a non-standard layout, e.g.
#   compose_files = ["/opt/defectdojo/docker-compose.yml"]
compose_files = []

# How long to wait for the server to answer after starting it. Django migrations
# on a cold database can take a minute; the app stays usable throughout.
startup_timeout_secs = 300
