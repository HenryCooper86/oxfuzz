# ==============================================================================
# oxfuzz -- LLM Provider Pool Configuration
# ==============================================================================

# Freeze duration before retrying a failed provider (seconds).
default_freeze_duration_secs = 60
max_freeze_duration_secs = 3600
# Interval between periodic health checks of frozen providers (seconds).
# On every tick each frozen provider is probed and thawed when it responds --
# including permanently frozen providers (invalid key, exhausted quota), which
# have no automatic thaw. Values below 1 are clamped to 1.
health_check_interval_secs = 30

# ==============================================================================
# Provider Definitions
#
# Same format as y-agent. Set `api_key` directly or use `api_key_env`.
# ==============================================================================

[[providers]]
id = "openai-main"
provider_type = "openai"
model = "gpt-4o"
tags = ["reasoning", "general", "code"]
max_concurrency = 3
context_window = 128000
# api_key_env = "OPENAI_API_KEY"

