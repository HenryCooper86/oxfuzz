# ==============================================================================
# hobot_fuzz -- Global Settings
# ==============================================================================

# Logging level: error, warn, info, debug, trace
log_level = "info"

# Output format: "pretty" (dev) or "json" (production)
log_format = "pretty"

# Default fuzzing workspace (corpora, crashes, build artifacts).
# Override with HF_FUZZ_WORKSPACE env var.
fuzz_workspace = "/tmp/hobot_fuzz_workspace"

# Default engine when none is specified on the CLI.
default_engine = "afl++"

# Default sanitizer.
default_sanitizer = "address"

# Maximum LLM rounds for harness iteration before giving up.
max_harness_iterations = 3

# Smoke fuzz duration in seconds before promoting a harness.
smoke_fuzz_duration_secs = 60

# Seconds without a coverage increase before a run proposes iterating
# (regenerate the harness / add seeds). Lower proposes sooner; set it very high
# to effectively silence the proposal. Override with HF_COVERAGE_STAGNATION_SECS.
coverage_stagnation_secs = 120

# Auto-revert policy: when a run's harness revision changed AND its edge
# coverage dropped by at least `auto_revert_threshold_pct` percent versus the
# previous run for the same target, automatically restore the previous
# (last-good) harness revision and recompile it. The recompile is HITL-gated
# like any other compile. Off by default -- opt in per project.
# Override with HF_AUTO_REVERT (1/true) and HF_AUTO_REVERT_THRESHOLD_PCT.
auto_revert_enabled = false
auto_revert_threshold_pct = 20.0