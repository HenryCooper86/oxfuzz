# ==============================================================================
# hobot_fuzz -- Global Settings
# ==============================================================================

# Seconds without a coverage increase before a run proposes iterating
# (regenerate the harness / add seeds). Lower proposes sooner; set it very high
# to effectively silence the proposal. Override with HF_COVERAGE_STAGNATION_SECS.
coverage_stagnation_secs = 120

# Auto-revert policy: when a run's harness revision changed AND its edge
# coverage dropped by at least `auto_revert_threshold_pct` percent versus the
# latest comparable run for the same target, automatically restore that
# last-good harness revision and recompile it. Comparable means the engine,
# duration, resources, sanitizer, corpus location, environment, and engine
# arguments match. The recompile is HITL-gated like any other compile. Off by
# default -- opt in per project. Threshold must be in (0, 100].
# Override with HF_AUTO_REVERT (1/true) and HF_AUTO_REVERT_THRESHOLD_PCT.
auto_revert_enabled = false
auto_revert_threshold_pct = 20.0

# Notify-only mode: when true, a detected regression is reported (logged to the
# run journal and surfaced in the UI / campaign history) but the harness is NOT
# restored automatically. Recommended for scheduled/headless campaigns, which run
# with permissive guardrails and would otherwise mutate the harness unattended.
# Override with HF_AUTO_REVERT_NOTIFY_ONLY.
auto_revert_notify_only = false

# Project knowledge indexing and retrieval. Only settings consumed by the
# production L2 project index are exposed here.
[knowledge]
l2_max_tokens = 450
min_similarity_threshold = 0.65
retrieval_strategy = "hybrid" # hybrid | keyword; semantic needs embeddings
bm25_weight = 1.0
vector_weight = 1.0

# Session tree limits. Additional historical SessionConfig fields were removed
# because no production lifecycle consumed them.
[session]
max_depth = 10

# Background campaign scheduling. A zero history limit means unlimited.
[scheduler]
max_concurrent_executions = 10
default_missed_policy = "skip" # catch_up | skip | backfill
default_concurrency_policy = "skip_if_running" # allow | skip_if_running | queue | cancel_previous
history_retention_limit = 100
