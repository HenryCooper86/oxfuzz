# ==============================================================================
# oxfuzz -- Global Settings
# ==============================================================================

# Seconds without a coverage increase before a run proposes iterating
# (regenerate the harness / add seeds). Lower proposes sooner; set it very high
# to effectively silence the proposal. Override with HF_COVERAGE_STAGNATION_SECS.
coverage_stagnation_secs = 120

# Stagnation escalation, counted in whole windows of `coverage_stagnation_secs`
# since coverage last progressed. The first window proposes improving the
# mutation inputs (seeds / dictionary / custom mutator); at
# `coverage_stagnation_new_harness_windows` the proposal escalates to
# regenerating the harness, and at `coverage_stagnation_stop_windows` it
# recommends stopping the target. Must satisfy
# 1 <= new_harness_windows < stop_windows. Overrides:
# HF_COVERAGE_STAGNATION_NEW_HARNESS_WINDOWS / HF_COVERAGE_STAGNATION_STOP_WINDOWS.
coverage_stagnation_new_harness_windows = 2
coverage_stagnation_stop_windows = 4

# Auto-revert policy: when a run's harness revision changed AND its edge
# coverage dropped by at least `auto_revert_threshold_pct` percent versus the
# latest comparable run for the same target, automatically restore that
# last-good harness revision and recompile it. Comparable means the engine,
# duration, resources, sanitizer, corpus location, environment, and engine
# arguments match. The recompile is HITL-gated like any other compile. Off by
# default -- opt in per project. Threshold must be in (0, 100].
# Override with HF_AUTO_REVERT (1/true) and HF_AUTO_REVERT_THRESHOLD_PCT.
auto_revert_enabled = false
auto_revert_threshold_pct = 20.0

# Notify-only mode: when true, a detected regression is reported (logged to the
# run journal and surfaced in the UI / campaign history) but the harness is NOT
# restored automatically. Recommended for scheduled/headless campaigns, which run
# with permissive guardrails and would otherwise mutate the harness unattended.
# Override with HF_AUTO_REVERT_NOTIFY_ONLY.
auto_revert_notify_only = false

# Fuzzing engine policy and defaults. These values are resolved by hf-service
# before every new harness operation or campaign. A Settings save therefore
# affects the next operation without changing a campaign already in flight.
[fuzzing]
enabled_engines = ["libfuzzer", "afl++", "honggfuzz", "clusterfuzzlite", "syzkaller"]
default_engine = "libfuzzer"
default_duration_secs = 60

# Resource limits for harness-based fuzzing campaigns. The service rejects a
# requested duration above this ceiling instead of silently clamping it.
[fuzzing.sandbox]
max_mem_mb = 2048
max_cpus = 1
max_duration_secs = 7200

# Optional Scapy automotive protocol adapter. Compile-time support and this
# runtime switch must both be enabled. The sidecar executes only in hf-runtime;
# offline PCAP and isolated vcan are the normal modes.
[automotive]
enabled = false
sidecar_image = "oxfuzz/scapy-automotive:2.7.0"
allowed_protocols = ["can", "can_fd", "iso_tp", "uds", "gmlan", "some_ip", "some_ip_sd", "do_ip", "obd", "ccp", "xcp", "bmw_hsfz", "sec_oc"]
allowed_modes = ["offline_pcap", "virtual_can"]
virtual_interfaces = ["vcan0"]

[automotive.limits]
max_packets = 10000
max_input_bytes = 67108864
max_payload_bytes = 1048576
max_duration_secs = 300
max_rate_per_second = 100
max_output_bytes = 67108864
max_mem_mb = 1024
max_cpus = 1

# Physical access remains disabled and empty by default. Enabling it also
# requires adding "physical_bench" to allowed_modes. Every operation still
# requires explicit approval and must match all three allowlists.
[automotive.physical_bench]
enabled = false
require_approval = true
interfaces = []
arbitration_ids = []
uds_services = []
allow_dangerous_services = false

# Project knowledge indexing and retrieval. Only settings consumed by the
# production L2 project index are exposed here.
[knowledge]
l2_max_tokens = 450
min_similarity_threshold = 0.65
retrieval_strategy = "hybrid" # hybrid | keyword; semantic needs embeddings
bm25_weight = 1.0
vector_weight = 1.0

# Session tree limits. Additional historical SessionConfig fields were removed
# because no production lifecycle consumed them.
[session]
max_depth = 10

# Background campaign scheduling. A zero history limit means unlimited.
[scheduler]
max_concurrent_executions = 10
default_missed_policy = "skip" # catch_up | skip | backfill
default_concurrency_policy = "skip_if_running" # allow | skip_if_running | queue | cancel_previous
history_retention_limit = 100
