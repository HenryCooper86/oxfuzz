# ==============================================================================
# hobot_fuzz -- Triage Agent
# ==============================================================================
# Sub-agent that owns crash classification and bug report drafting.

[agent]
id = "triage-agent"
model_tags = ["reasoning", "code"]
autonomy = "Draft"
max_iterations = 3

[agent.tools]
enabled = ["FileRead", "CrashMinimize", "KnowledgeSearch", "ShellExec"]