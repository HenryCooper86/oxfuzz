# ==============================================================================
# hobot_fuzz -- Runtime / Sandbox Configuration
# ==============================================================================

# Backend: "docker" (default, isolated) or "native" (dev only, opt-in).
backend = "docker"

# Docker image used for sandboxed builds and fuzz runs.
docker_image = "hobot/fuzz-sandbox:latest"

# Workspace mount inside the container.
container_workspace = "/work"

# Default resource limits for sandboxed commands.
[limits]
max_mem_mb = 4096
max_cpus = 2
max_duration_secs = 7200

# Network access during build (true) and fuzz run (false recommended).
[network]
build = true
fuzz = false