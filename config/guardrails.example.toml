# ==============================================================================
# hobot_fuzz -- Guardrails Configuration
# ==============================================================================

# Permission mode: "strict" (HITL on High risk), "auto" (no HITL), "manual".
permission_mode = "strict"

# Risk score threshold above which HITL approval is required.
hitl_threshold = 0.6

# Loop detection: max consecutive identical tool calls.
max_identical_calls = 3

# Content filtering: reject responses matching these patterns.
[content_filter]
enabled = true
reject_patterns = []

# Risk scoring weights per tool.
[risk.tools]
ShellExec = 0.8
FuzzRun = 0.9
HarnessBuild = 0.5
CrashMinimize = 0.4
FileRead = 0.1
FileWrite = 0.3
ProjectScan = 0.1
KnowledgeSearch = 0.0
Task = 0.2